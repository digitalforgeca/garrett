<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garrett — Video Keeper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="header-logo">
          <img src="icons/icon48.png" style="width: 22px; height: 22px; border-radius: 4px;" alt="Garrett">
        </div>
        <div>
          <h1 class="header-title">Garrett</h1>
          <p class="header-subtitle">Video Keeper</p>
        </div>
      </div>
      <button id="refresh-btn" class="icon-button" title="Rescan Tab">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </header>

    <!-- Main Content -->
    <main class="content">
      <div id="status-bar" class="status-bar">
        <span>Scanning page for videos...</span>
      </div>

      <!-- Videos List -->
      <div id="video-section">
        <div id="video-list" class="video-list"></div>
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
        </div>
        <h3>No videos detected</h3>
        <p>Play a video on the page and click rescan.</p>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
